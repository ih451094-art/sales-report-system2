<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>تسجيل الدخول</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            background: linear-gradient(
                135deg,
                #111a2e,
                #263653
            );

            font-family:
                Arial,
                Tahoma,
                sans-serif;

        }


        .login-box {

            width: 90%;

            max-width: 400px;

            background: #ffffff;

            border-radius: 18px;

            padding: 35px;

            box-shadow:
                0 20px 60px
                rgba(0, 0, 0, 0.30);

        }


        .logo {

            width: 75px;

            height: 75px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background: #e97900;

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 32px;

        }


        h1 {

            text-align: center;

            color: #111a2e;

            margin: 0 0 8px;

            font-size: 25px;

        }


        .subtitle {

            text-align: center;

            color: #777;

            margin-bottom: 30px;

            font-size: 15px;

        }


        .form-group {

            margin-bottom: 18px;

        }


        label {

            display: block;

            margin-bottom: 8px;

            color: #333;

            font-weight: bold;

        }


        input {

            width: 100%;

            padding: 13px 14px;

            border: 1px solid #d5d9e0;

            border-radius: 8px;

            font-size: 16px;

            outline: none;

            direction: rtl;

        }


        input:focus {

            border-color: #e97900;

            box-shadow:
                0 0 0 3px
                rgba(233, 121, 0, 0.12);

        }


        .login-button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #e97900;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;

        }


        .login-button:hover {

            background: #cc6500;

        }


        .error {

            background: #ffe5e5;

            color: #b42318;

            padding: 11px;

            border-radius: 8px;

            margin-bottom: 18px;

            text-align: center;

            font-size: 14px;

        }

    </style>

</head>


<body>


    <div class="login-box">


        <div class="logo">

            📊

        </div>


        <h1>

            نظام التقارير

        </h1>


        <div class="subtitle">

            تسجيل الدخول إلى النظام

        </div>


        {% if error %}

        <div class="error">

            {{ error }}

        </div>

        {% endif %}


        <form
            method="POST"
            action="/login"
        >


            <div class="form-group">

                <label>

                    اسم المستخدم

                </label>


                <input
                    type="text"
                    name="username"
                    placeholder="أدخل اسم المستخدم"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="form-group">

                <label>

                    كلمة المرور

                </label>


                <input
                    type="password"
                    name="password"
                    placeholder="أدخل كلمة المرور"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button"
            >

                تسجيل الدخول

            </button>


        </form>


    </div>


</body>

</html>
