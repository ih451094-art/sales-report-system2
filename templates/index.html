<!DOCTYPE html>

                type="button"
                class="btn history"
                onclick="openReportsHistory()">

            <button
                type="button"

        </div>

    <!-- =================================================
         REPORTS
    ================================================== -->

    <div id="reports-container"></div>



    <!-- =================================================
         نافذة التقارير السابقة
    ================================================== -->

    <div
        id="historyModal"
        class="history-modal">


        <div class="history-box">


            <div class="history-header">

                <h2>

                    📋 التقارير السابقة

                <button
                    type="button"
                    class="close-history"
                    onclick="closeReportsHistory()">

                    ×

            </div>


            <div
                id="historyList"
                class="history-list">

                <div class="history-loading">

                    جاري تحميل التقارير...

            </div>


        </div>

</main>



<!-- =====================================================

===================================================== -->

/* =====================================================
   تحديد تاريخ اليوم تلقائيًا
===================================================== */

function getTodayDate() {

    const today = new Date();

    const year =
        today.getFullYear();

    const month =
        String(
            today.getMonth() + 1
        ).padStart(2, "0");

    const day =
        String(
            today.getDate()
        ).padStart(2, "0");


    return (
        year +
        "-" +
        month +
        "-" +
        day
    );

}


document
    .getElementById("reportDate")
    .value = getTodayDate();

/* =====================================================
   إنشاء جدول التقرير
===================================================== */

function createReport(
    report,
    reportIndex
) {


    let html = `

        <section class="report-card">

            <div class="report-title">

                <h2>

                    ${report.name}

                </h2>

            </div>


            <div class="table-scroll">

                <table
                    class="report-table"
                    id="report-table-${reportIndex}">


                    <thead>

                        <tr>

                            <th
                                rowspan="2"
                                class="branch-header">

                                الفرع

                            </th>

    `;


    /* ================================================
       أسماء الشركات
    ================================================= */

    report.columns.forEach(
        function(column) {

            html += `

                <th colspan="2">

                    ${column}

                </th>

            `;

        }
    );


    html += `

                        </tr>


                        <tr>

    `;


    /* ================================================
       الطلبات / المبلغ
    ================================================= */

    report.columns.forEach(
        function() {

            html += `

                <th>

                    الطلبات

                </th>


                <th>

                    المبلغ

                </th>

            `;

        }
    );


    html += `

                        </tr>

                    </thead>


                    <tbody>

    `;


    /* ================================================
       الفروع
    ================================================= */

    report.branches.forEach(
        function(
            branch,
            rowIndex
        ) {


            const row =
                report.data[rowIndex];


            html += `

                <tr>

                    <td class="branch-name">

                        ${branch}

                    </td>

            `;


            for (
                let columnIndex = 0;
                columnIndex < report.columns.length;
                columnIndex++
            ) {


                const orders =
                    row[
                        columnIndex * 2
                    ] ?? 0;


                const amount =
                    row[
                        columnIndex * 2 + 1
                    ] ?? 0;


                html += `

                    <td>

                        <input
                            type="number"
                            min="0"
                            step="1"
                            class="data-input orders-input"

                            data-report="${reportIndex}"

                            data-row="${rowIndex}"

                            data-column="${columnIndex * 2}"

                            value="${orders}">

                    </td>


                    <td>

                        <input
                            type="number"
                            min="0"
                            step="0.001"
                            class="data-input amount-input"

                            data-report="${reportIndex}"

                            data-row="${rowIndex}"

                            data-column="${columnIndex * 2 + 1}"

                            value="${amount}">

                    </td>

                `;

            }


            html += `

                </tr>

            `;

        }
    );


    /* ================================================
       الإجمالي
    ================================================= */

    html += `

                    </tbody>


                    <tfoot>

                        <tr class="total-row">

                            <td>

                                الإجمالي

                            </td>

    `;


    report.columns.forEach(
        function(
            column,
            columnIndex
        ) {


            html += `

                <td
                    id="total-orders-${reportIndex}-${columnIndex}">

                    0

                </td>


                <td
                    id="total-amount-${reportIndex}-${columnIndex}">

                    0.000

                </td>

            `;

        }
    );


    html += `

                        </tr>

                    </tfoot>


                </table>

            </div>

        </section>

    `;


    return html;

}



/* =====================================================
   عرض جميع التقارير
===================================================== */

function renderReports() {


    const container =
        document.getElementById(
            "reports-container"
        );


    container.innerHTML = "";


    reports.forEach(
        function(
            report,
            index
        ) {


            container.innerHTML +=
                createReport(
                    report,
                    index
                );

        }
    );


    attachInputEvents();


    calculateAllTotals();

}



/* =====================================================
   ربط خانات الإدخال
===================================================== */

function attachInputEvents() {


    document
        .querySelectorAll(".data-input")
        .forEach(
            function(input) {


                input.addEventListener(
                    "input",
                    function() {

                        calculateAllTotals();

                    }
                );


            }
        );

}



/* =====================================================
   حساب الإجماليات
===================================================== */

function calculateAllTotals() {


    reports.forEach(
        function(
            report,
            reportIndex
        ) {


            for (
                let columnIndex = 0;
                columnIndex < report.columns.length;
                columnIndex++
            ) {


                let ordersTotal = 0;

                let amountTotal = 0;


                report.branches.forEach(
                    function(
                        branch,
                        rowIndex
                    ) {


                        const ordersInput =
                            document.querySelector(
                                `[data-report="${reportIndex}"][data-row="${rowIndex}"][data-column="${columnIndex * 2}"]`
                            );


                        const amountInput =
                            document.querySelector(
                                `[data-report="${reportIndex}"][data-row="${rowIndex}"][data-column="${columnIndex * 2 + 1}"]`
                            );


                        if (ordersInput) {

                            ordersTotal +=
                                Number(
                                    ordersInput.value
                                ) || 0;

                        }


                        if (amountInput) {

                            amountTotal +=
                                Number(
                                    amountInput.value
                                ) || 0;

                        }


                    }
                );


                const ordersTotalElement =
                    document.getElementById(
                        `total-orders-${reportIndex}-${columnIndex}`
                    );


                const amountTotalElement =
                    document.getElementById(
                        `total-amount-${reportIndex}-${columnIndex}`
                    );


                if (ordersTotalElement) {

                    ordersTotalElement.textContent =
                        ordersTotal;

                }


                if (amountTotalElement) {

                    amountTotalElement.textContent =
                        amountTotal.toFixed(3);

                }

            }

        }
    );

}



/* =====================================================
   تجهيز بيانات الحفظ
===================================================== */

function collectReportData() {


    const savedData = [];


    reports.forEach(
        function(
            report,
            reportIndex
        ) {


            const reportRows = [];


            report.branches.forEach(
                function(
                    branch,
                    rowIndex
                ) {


                    const rowData = [];


                    for (
                        let columnIndex = 0;
                        columnIndex < report.columns.length;
                        columnIndex++
                    ) {


                        const ordersInput =
                            document.querySelector(
                                `[data-report="${reportIndex}"][data-row="${rowIndex}"][data-column="${columnIndex * 2}"]`
                            );


                        const amountInput =
                            document.querySelector(
                                `[data-report="${reportIndex}"][data-row="${rowIndex}"][data-column="${columnIndex * 2 + 1}"]`
                            );


                        rowData.push(
                            Number(
                                ordersInput?.value
                            ) || 0
                        );


                        rowData.push(
                            Number(
                                amountInput?.value
                            ) || 0
                        );

                    }


                    reportRows.push(
                        rowData
                    );

                }
            );


            savedData.push(
                reportRows
            );

        }
    );


    return savedData;

}



/* =====================================================
   حفظ التقرير
===================================================== */

async function saveReport() {


    const date =
        document.getElementById(
            "reportDate"
        ).value;


    if (!date) {

        alert(
            "من فضلك اختر تاريخ التقرير"
        );

        return;

    }


    const savedData =
        collectReportData();


    try {


        const response =
            await fetch(
                "/api/save",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body: JSON.stringify({

                        date: date,

                        data: savedData

                    })

                }
            );


        const result =
            await response.json();


        if (result.success) {


            alert(

                "✅ تم حفظ التقرير بنجاح\n\n" +

                "التاريخ: " +

                date

            );


        } else {


            alert(

                "❌ حدث خطأ أثناء الحفظ\n\n" +

                result.message

            );

        }


    } catch (error) {


        console.error(error);


        alert(
            "❌ لم يتم الاتصال بالخادم"
        );

    }

}



/* =====================================================
   تحميل تقرير من قاعدة البيانات
===================================================== */

async function loadReport(date) {


    if (!date) {

        return;

    }


    try {


        const response =
            await fetch(
                "/api/load/" + date
            );


        const result =
            await response.json();


        if (!result.success) {


            resetReportInputs();


            calculateAllTotals();


            return;

        }


        const savedData =
            result.data;


        savedData.forEach(
            function(
                reportRows,
                reportIndex
            ) {


                reportRows.forEach(
                    function(
                        rowData,
                        rowIndex
                    ) {


                        rowData.forEach(
                            function(
                                value,
                                columnIndex
                            ) {


                                const input =
                                    document.querySelector(
                                        `[data-report="${reportIndex}"][data-row="${rowIndex}"][data-column="${columnIndex}"]`
                                    );


                                if (input) {

                                    input.value =
                                        value;

                                }


                            }
                        );


                    }
                );


            }
        );


        calculateAllTotals();


    } catch (error) {


        console.error(
            "خطأ أثناء تحميل التقرير:",
            error
        );


        alert(
            "حدث خطأ أثناء تحميل التقرير"
        );

    }

}



/* =====================================================
   تصفير جميع الخانات
===================================================== */

function resetReportInputs() {


    document
        .querySelectorAll(
            ".data-input"
        )
        .forEach(
            function(input) {

                input.value = 0;

            }
        );


}



/* =====================================================
   تغيير التاريخ
===================================================== */

document
    .getElementById("reportDate")
    .addEventListener(
        "change",
        function() {

            loadReport(
                this.value
            );

        }
    );



/* =====================================================
   تصدير Excel
===================================================== */

function exportExcel() {


    const date =
        document.getElementById(
            "reportDate"
        ).value;


    if (!date) {

        alert(
            "من فضلك اختر تاريخ التقرير أولاً."
        );

        return;

    }


    window.location.href =
        "/api/export-excel/" +
        date;

}



/* =====================================================
   فتح نافذة التقارير السابقة
===================================================== */

async function openReportsHistory() {


    const modal =
        document.getElementById(
            "historyModal"
        );


    const list =
        document.getElementById(
            "historyList"
        );


    modal.classList.add("show");


    list.innerHTML = `

        <div class="history-loading">

            جاري تحميل التقارير...

        </div>

    `;


    try {


        const response =
            await fetch(
                "/api/reports"
            );


        const result =
            await response.json();


        if (!result.success) {


            list.innerHTML = `

                <div class="history-empty">

                    حدث خطأ أثناء تحميل التقارير.

                </div>

            `;

            return;

        }


        if (
            result.reports.length === 0
        ) {


            list.innerHTML = `

                <div class="history-empty">

                    لا توجد تقارير محفوظة حتى الآن.

                </div>

            `;

            return;

        }


        list.innerHTML = "";


        result.reports.forEach(
            function(date) {


                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "history-item";


                item.innerHTML = `

                    <div class="history-date">

                        📅 ${formatDateArabic(date)}

                    </div>


                    <button
                        type="button"
                        class="history-open-btn"
                        onclick="openSavedReport('${date}')">

                        فتح التقرير

                    </button>

                `;


                list.appendChild(
                    item
                );


            }
        );


    } catch (error) {


        console.error(error);


        list.innerHTML = `

            <div class="history-empty">

                تعذر الاتصال بالخادم.

            </div>

        `;

    }

}



/* =====================================================
   إغلاق نافذة التقارير
===================================================== */

function closeReportsHistory() {


    const modal =
        document.getElementById(
            "historyModal"
        );


    modal.classList.remove(
        "show"
    );

}



/* =====================================================
   فتح تقرير محفوظ
===================================================== */

async function openSavedReport(date) {


    const dateInput =
        document.getElementById(
            "reportDate"
        );


    dateInput.value =
        date;


    await loadReport(
        date
    );


    closeReportsHistory();


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}



/* =====================================================
   تحويل التاريخ إلى شكل عربي
===================================================== */

function formatDateArabic(date) {


    const parts =
        date.split("-");


    if (
        parts.length !== 3
    ) {

        return date;

    }


    return (

        parts[2] +
        "/" +
        parts[1] +
        "/" +
        parts[0]

    );

}



/* =====================================================
   تشغيل الصفحة
===================================================== */

renderReports();


/* تحميل تقرير تاريخ اليوم */

loadReport(
    document.getElementById(
        "reportDate"
    ).value
);


</script>
